# Scripts for the "same words, different voice" experiments.
#
# split: "dev" scripts may be used to tune thresholds. "heldout" scripts are reserved: do not look at
#        their results until the policy numbers are frozen.
# topic: words an on-topic reply would mention. This is a crude automatic check that adapting the
#        style did not change the subject. Only requests have it: a good reply to a plain statement
#        ("That sounds important. What did you find out?") often repeats none of its words.
#        Human ratings replace it for real results.

# Neutral wording, at least nine words each so pace can be measured. The words give no hint of the
# speaker's mood, so any change in the reply must come from the delivery.
neutral:
  - {id: n01, split: dev, text: "I got my test results back today, and I wanted to talk about them."}
  - {id: n02, split: dev, text: "My manager asked to see me first thing tomorrow morning."}
  - {id: n03, split: dev, text: "I just finished reading the email you sent me this afternoon."}
  - {id: n04, split: dev, text: "The package I ordered last week finally arrived at my door."}
  - {id: n05, split: dev, text: "My sister called me last night to tell me she is moving."}
  - {id: n06, split: dev, text: "I am going back to my hometown for the holidays this year."}
  - {id: n07, split: dev, text: "They announced the results of the interview I did on Monday."}
  - {id: n08, split: dev, text: "It looks like I will be working from home for the rest of the month."}
  - {id: n09, split: heldout, text: "The doctor's office left me a voicemail asking me to call back."}
  - {id: n10, split: heldout, text: "I spent the whole weekend cleaning out my old apartment."}
  - {id: n11, split: heldout, text: "My landlord told me the rent is changing starting next month."}
  - {id: n12, split: heldout, text: "I ran into an old friend at the grocery store this morning."}

# The same request in three registers. Delivery (voice and pace) is held fixed when these are
# rendered, so any change in the reply must come from the wording.
register:
  - id: r01
    split: dev
    topic: [friday, reschedule, move, meeting]
    casual: "Hey, so I kinda gotta bail on our thing tomorrow, ngl my week is cooked. Can we move it to Friday?"
    neutral: "I can't make our meeting tomorrow because this week got busy. Can we move it to Friday?"
    formal: "I would like to request that we reschedule tomorrow's meeting, as my availability has changed. Would Friday be acceptable?"
  - id: r02
    split: dev
    topic: [draft, feedback, review, look]
    casual: "Yo, I just finished the draft and lowkey I dunno if it's any good. Wanna take a look and tell me what's off?"
    neutral: "I just finished the draft and I'm not sure it's good. Can you look at it and tell me what to fix?"
    formal: "I have completed the draft and would appreciate your feedback. Could you please review it and advise on any required changes?"
  - id: r03
    split: dev
    topic: [interest, compound, money, saving, save]
    casual: "Okay so I'm tryna save some money but I dunno how compound interest works, for real. Can you break it down?"
    neutral: "I'm trying to save money but I don't understand how compound interest works. Can you explain it?"
    formal: "I am planning my savings and would like to confirm my understanding of compound interest. Could you please provide a brief explanation?"
  - id: r04
    split: dev
    topic: [order, deliver, arrive, status, track]
    casual: "Bruh, my order was supposed to get here like three days ago and it's still not here. What's the vibe, where is it?"
    neutral: "My order was supposed to arrive three days ago and it still isn't here. Can you tell me where it is?"
    formal: "My order was scheduled to arrive three days ago and has not yet been delivered. Could you please provide an update regarding its status?"
  - id: r05
    split: heldout
    topic: [workout, exercise, beginner, walk, fitness]
    casual: "Ngl I've been kinda lazy lately and I wanna get back in shape. Got any chill workout ideas for a beginner?"
    neutral: "I haven't exercised much lately and I want to get back in shape. Do you have workout ideas for a beginner?"
    formal: "I have not exercised regularly in recent months and would like to improve my fitness. Could you please recommend a suitable program for a beginner?"
  - id: r06
    split: heldout
    topic: [interview, prepare, practice, question]
    casual: "So I got this interview on Monday and I'm lowkey freaking out. What kinda stuff should I prep?"
    neutral: "I have an interview on Monday and I'm nervous. What should I prepare?"
    formal: "I have an interview scheduled for Monday and would like to ensure that I am well prepared. What would you recommend that I review?"

# Distress carried by the words. Used for multi-turn tests of the support attack and release.
distress:
  - {id: d01, split: dev, text: "I just got laid off this morning and I don't know what to do.", topic: [job, laid, work]}
  - {id: d02, split: dev, text: "My grandmother passed away last night and I can't sleep.", topic: [grandmother, sleep, loss]}

# A scripted four-turn conversation for the demo. `rate` is the macOS `say` rate in words per minute.
# `say` cannot go slower than about 150, so slow turns are also stretched (pitch kept) by `stretch`.
demo:
  - {text: "Hey, so I kinda gotta bail on our thing tomorrow, ngl my week is cooked. Can we move it to Friday?", rate: 215, voice: Samantha}
  - {text: "Yeah Friday afternoon works. What time is chill for you?", rate: 215, voice: Samantha}
  - {text: "Honestly I just got laid off this morning and I don't know what to do.", rate: 150, stretch: 1.2, voice: Samantha}
  - {text: "Thank you. Could you please help me draft a brief message to my former manager regarding a reference?", rate: 150, stretch: 1.2, voice: Samantha}
