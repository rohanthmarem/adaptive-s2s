emotions:
  neutral:
    direction: a plain, neutral, matter-of-fact tone, the same calm level from the first word to the last
    classifier: neutral
  happy:
    direction: bright, warm happiness and excitement, smiling through every word of the sentence
    classifier: happy
  sad:
    direction: deep sadness, heavy and quiet, the voice close to breaking on every word
    classifier: sad
  angry:
    direction: real anger, loud, hard and clipped, furious on every word
    classifier: angry
  anxious:
    direction: anxiety and nerves, fast, shaky and breathy, tense and worried the whole way through
    classifier: fearful
  surprised:
    direction: genuine astonishment, pitch jumping up, as if you cannot believe it, for the whole sentence
    classifier: surprised
  disgusted:
    direction: deep disgust and revulsion, recoiling as if something is gross, a grimacing ugh quality on every word
    classifier: disgusted
  bored:
    direction: utter boredom and no interest, a flat slow monotone with low energy, trailing off, a sigh in the voice throughout
    acoustic: low_energy
  sarcastic:
    direction: heavy sarcasm, a dry mocking drawl that stretches the key words and clearly means the opposite, for the whole sentence
    acoustic: marked
  amused:
    direction: amusement, holding back laughter, a chuckle running through the whole sentence
    acoustic: marked
  tender:
    direction: tenderness, soft, warm and caring, gentle and close, as if comforting someone you love, for the whole sentence
    acoustic: marked
  contemptuous:
    direction: cold contempt and superiority, sneering and dismissive, looking down on the listener throughout
    acoustic: marked

